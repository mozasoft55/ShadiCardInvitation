<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <style>
    body { margin: 0; background: #fdf6e9; }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Georgia, serif;
      color: #7a1426;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .spin {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(201,162,74,0.3);
      border-top-color: #c9a24a;
      border-radius: 50%;
      animation: s 0.9s infinite linear;
      margin-bottom: 14px;
    }
    @keyframes s { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <div>Loading Royal Invitation...</div>
  </div>

  <main id="app" style="display: none;"></main>

  <script type="module">
    // APNA DEPLOYED GOOGLE APPS SCRIPT URL YAHAN DAALEIN
    const API_URL = "https://script.google.com/macros/s/AKfycbwe-4k-Z0K0pB3t00F5kHw2eP0-9_YOUR_DEPLOYMENT_ID/exec";

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('w') || 'tarana-akbar-w0001';
      const guest = {
        name: params.get('g') || 'Guest',
        persons: parseInt(params.get('p') || '1', 10),
        with_family: params.get('f') === '1'
      };

      try {
        const res = await fetch(`${API_URL}?action=wedding&slug=${encodeURIComponent(slug)}`);
        const data = await res.json();

        if (!data.success) {
          document.getElementById('loading').innerHTML = `<h3>${data.error || 'Invitation not found'}</h3>`;
          return;
        }

        const templateId = data.wedding.template_id || 'template-02';
        const mod = await import(`./templates/${templateId}.js`);
        
        const app = document.getElementById('app');
        app.innerHTML = mod.default({ guest, wedding: data.wedding, events: data.events });
        
        document.getElementById('loading').style.display = 'none';
        app.style.display = 'block';

        // Mount click listeners & slider logic
        if (typeof mod.mount === 'function') {
          mod.mount(app);
        } else if (typeof mod.default.mount === 'function') {
          mod.default.mount(app);
        }

      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `<h3>Failed to load card. Please check internet connection.</h3>`;
      }
    }

    init();
  </script>
</body>
</html>
